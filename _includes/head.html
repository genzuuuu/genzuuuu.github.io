<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  {%- if page.title and page.title != 'Home' -%}
    {{ page.title | capitalize }} · {{ site.name }}
  {%- else -%}
    {{ site.name }}
  {%- endif -%}
</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% assign favicon_version = site.favicon_version | default: '2' %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v={{ favicon_version }}" sizes="any">
<link rel="icon" href="{{ '/favicon.png' | relative_url }}?v={{ favicon_version }}" type="image/png">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}?v={{ favicon_version }}">
<link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}?v={{ favicon_version }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lato:wght@400;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% seo %}
