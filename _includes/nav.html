<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.name }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign item_path = item.url | remove: '/' %}
        {% assign page_path = page.url | remove: '/' %}
        <a
          class="nav-link{% if page_path == item_path %} is-active{% endif %}"
          href="{{ item.url | relative_url }}"
        >{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
